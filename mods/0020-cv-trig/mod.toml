[mod]
id      = "0020-cv-trig"
title   = "CTRL IN triggers a track"

enabled = true

# 0017 holds the same two detours (0x40120e9e, 0x40131962) and cave19.
excludes = ["0017-ctrl-in-perf", "0011-batch-probe"]

# re-only | built | hardware-verified | retracted
status  = "built"

summary = """
Fixed, no settings: a gate into CTRL IN 1 plays T1 (pad 1, BD), into CTRL IN 2
T2 (pad 2, SD), in any CONTROL INPUT mode, OFF included (2026-11-13: a version
that left ports in mode OFF alone played nothing on the unit, whose ports were
OFF). Both ports' thresholds come from CTRL IN 1's millivolt conversion: with
CTRL IN 2's own, a gate into it never played its track on the unit. Note
60 (the track's own pitch) at velocity 127, once: one gate is one trig. The
note-off follows len_ms later whatever the gate's length; falling below 0.5 V
only re-arms the port, and for 2 ms after a trig the port is not read, so a
bouncing edge cannot trig twice. (Until 2026-11-13 the gate's length was the
note's: a long gate, or a sound holding until note-off, played on.) The input
is read signed, as adc_pedal_update reads it. The thresholds are turned into each port's raw
units by stock's millivolt conversion (0x4013f3fa), as its CV levels are.
Stock's CONTROL IN MOD routes keep working on the same port. (The TRIG DEST menu
item is removed.)

The edges are found in the audio interrupt just after adc_pedal_update
(0x40120e9e, every 0.67 ms) on the raw converter result, not the smoothed value,
which lags by tens of milliseconds. Each edge signals the MIDI task's semaphore;
the task plays it at the top of its loop (0x40082d12) through stock's note_on and
note_off, as Overbridge's notes do (source 2), so the engine's note lists are only
touched from the task that already touches them for MIDI.
"""

[sources]
stub = "stub.s"

[params]
# The note's length in ms: how long after a trig its note-off is sent. 50 ms is
# about a 1/16 at 75 BPM; sounds with a finite AMP hold do not hear it.
len_ms = 50

[requires]
shared = false
symbols = []
