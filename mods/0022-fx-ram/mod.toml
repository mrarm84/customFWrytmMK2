[mod]
id      = "0022-fx-ram"
title   = "The delay's SDRAM ring halved to 2 MB, freeing 0x4B600000..0x4B7FFFFF"

enabled = true

# re-only | built | hardware-verified | retracted
status  = "built"

summary = """
The delay line is a 4 MB SDRAM ring at 0x4B400000, cleared at audio start-up
(0x4010ddd2) and streamed by eDMA: TCD 42 writes 32 stereo frames a block (8 B a
frame, two 32-bit samples) at 0x4B400000 + idx * 8, idx the frame index at
0x8000e1c8 masked with 0x7ffff; TCD 30 reads the delayed position the same way,
with scatter-gather images at 0x8000e180, 0x8000e1a0 (read) and 0x8000e140
(write). Both wrap with the eDMA modulo (SMOD / DMOD 22, 4 MB). The longest delay
is clamped to 384000 frames (8 s).

This mod halves the ring: the masks to 0x3ffff, the modulo to 21 in every
descriptor and image, and the clamp to 256000 frames (5.33 s). The delay sounds as
before at any time up to 5.33 s; longer settings (slow tempos, long TIME) hold at
5.33 s. 0x4B600000..0x4B7FFFFF (2 MB) is then free RAM for the effects and
machines that need memory: no code in the image addresses it, and the start-up
clear (still 4 MB) zeroes it once at boot.
"""

